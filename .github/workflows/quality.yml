name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check Edge Functions
        run: deno check --config supabase/functions/deno.json supabase/functions/get-document-access/index.ts supabase/functions/send-signing-email/index.ts supabase/functions/verify-document/index.ts

      - name: Test final PDF generation
        run: deno test --config supabase/functions/deno.json supabase/functions/_shared/finalPdf_test.ts supabase/functions/_shared/documentVerification_test.ts

      - name: Apply database migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/platform_stubs.sql
          for migration in supabase/migrations/*.sql; do
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Test database security boundaries
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/security_regression.sql

      - name: Audit dependencies
        run: npm audit --audit-level=high
